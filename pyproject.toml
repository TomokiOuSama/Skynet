[project]
name = "skynet-kol-tracker"
version = "0.1.0"
description = "Self-evolving KOL tracking system for small/mid-cap stock influencers"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "tweepy>=4.14",

    "beautifulsoup4>=4.12",
    "yfinance>=0.2",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "apscheduler>=3.10",
    "openai>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
