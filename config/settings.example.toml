# Skynet KOL Tracker Configuration
# Copy to settings.toml and fill in your API keys

[twitter]
bearer_token = ""

[stock]
alpha_vantage_key = ""
focus_sectors = ["semiconductors", "technology"]
max_market_cap = 10000
min_market_cap = 100

[scoring]
originality_weight = 0.35
alpha_weight = 0.30
accuracy_weight = 0.25
social_weight = 0.10
accuracy_window_days = [7, 30, 60, 90, 180, 360]
score_decay_half_life = 60

[discovery]
max_discovery_depth = 3
min_engagement_threshold = 100
discovery_interval_hours = 24

[llm]
provider = "openai"
model = "gpt-4o-mini"
api_key = ""

[database]
url = "sqlite+aiosqlite:///skynet.db"

# Seed KOLs — each can have multiple platform accounts
# Twitter is used for discovery (social graph expansion)
# Substack is used for deep content analysis (stock call extraction)

[[seeds]]
name = "SemiAnalysis"
twitter = "SemiAnalysis"
substack = "semianalysis"
kol_type = "stock_picker"

[[seeds]]
name = "Fabricated Knowledge"
twitter = "FassyFas"
substack = "fabricatedknowledge"
kol_type = "stock_picker"

[[seeds]]
name = "FundaAI"
substack = "fundaai"
kol_type = "stock_picker"

[[seeds]]
name = "Citrini Research"
twitter = "CitriniResearch"
